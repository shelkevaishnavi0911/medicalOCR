spring.application.name=medical-report-ocr
server.port=8080

app.auth.token=${AUTH_TOKEN}

app.datalab.api-key=${DATALAB_API_KEY}
app.datalab.base-url=${DATALAB_BASE_URL:https://www.datalab.to}

# Upload limits
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}

app.datalab.poll-interval-ms=${DATALAB_POLL_INTERVAL_MS:2000}
app.datalab.max-poll-attempts=${DATALAB_MAX_POLL_ATTEMPTS:60}